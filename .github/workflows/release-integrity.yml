name: Release integrity
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (v0.0.34) or latest
        required: true
        default: latest
        type: string
permissions:
  contents: read
jobs:
  verify:
    name: Verify signed release downloads
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read public verification script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - name: Verify hashes and Ed25519 signatures
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || 'latest' }}
        run: node .github/scripts/verify-release.cjs
      - name: Save verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-integrity
          path: release-integrity.json
          if-no-files-found: error
          retention-days: 90
